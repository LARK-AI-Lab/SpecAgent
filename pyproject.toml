[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "specagent"
version = "0.1.0"
description = "SpecAgent: a Weak model drafts agent trajectories, a Strong model reviews and repairs them"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = ["jsonschema>=4.23,<5"]

[project.optional-dependencies]
tau2 = ["openai>=1.0", "pydantic>=2"]
automationbench = ["openai>=1.0", "httpx>=0.27"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.12",
    "openai>=1.0",
    "httpx>=0.27",
    "pydantic>=2",
]

[tool.hatch.build.targets.wheel]
packages = ["src/specagent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
